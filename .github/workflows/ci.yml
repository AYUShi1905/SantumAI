name: Santum AI Pre-Deployment CI/CD

# Only trigger the workflow if changes are made to the backend 'app' directory
on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'app/**'

jobs:
  run-checks-and-deploy:
    name: Run Pre-Deployment Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Syntax Compilation & Test Suite
        env:
          # Required config variables defined with dummy values to bypass Pydantic startup validations
          QDRANT_API_KEY: "mock_qdrant_key"
          QDRANT_URL: "https://mock.qdrant.io"
          COLLECTION_NAME: "mock_collection"
          GOOGLE_API_KEY: "mock_google_key"
          OPENAI_API_KEY: "mock_openai_key"
        run: |
          cd app
          python check_project.py

      # Trigger Render deployment hook ONLY when all compilation and tests pass successfully
      - name: Trigger Render Deploy Hook
        if: success()
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "🚀 Triggering Render Deployment..."
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          else
            echo "⚠️ RENDER_DEPLOY_HOOK_URL secret is not set. Skipping auto-deployment triggering."
          fi
